server {
    listen 80 default_server;
    server_name _;

    # Application entrypoints live in /var/www/app/public.
    root /var/www/app/public;
    index index.php;

    client_max_body_size 16M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 120;
    }

    # Never expose source, config, storage or version-control metadata.
    location ~ ^/(app|bin|storage|tests|vendor|deploy)/ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }
    location = /config.php { deny all; return 404; }
    location ~* \.(sql|sqlite|log|ini|sh|yaml|yml)$ { deny all; return 404; }
}
